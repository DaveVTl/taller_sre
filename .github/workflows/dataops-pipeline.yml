name: DataOps Pipeline – Bronze to Gold (SQL-only)

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Commit o tag a desplegar (lo usa preparar-produccion)"
        type: string
        required: false
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "framework/**"
      - ".github/workflows/dataops-pipeline.yml"

env:
  RUN_ID: ${{ github.run_id }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Deploy base objects (schema + bronze + ops tables)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SQL_FILE: framework/deployment/deploy.sql
        run: |
          python framework/processing/run_sql.py

      - name: Deploy Silver v2 + Gold tables
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SQL_FILE: framework/deployment/deploy_silver_v2.sql
        run: |
          python framework/processing/run_sql.py

      - name: Log event
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          STAGE: deploy
          STATUS: ${{ job.status }}
          DETAILS: sha=${{ inputs.ref || github.sha }}
        run: |
          python framework/monitoring/log_event.py

  bronze:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Ingest Bronze into Databricks SQL
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          CSV_DIR: data/source
          TARGET_TABLE: gameday.bronze_customers
          SOURCE_NAME: github_actions
        run: |
          python framework/ingestion/ingest_bronze.py

      - name: Log event
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          STAGE: bronze
          STATUS: ${{ job.status }}
          DETAILS: sha=${{ inputs.ref || github.sha }}
        run: |
          python framework/monitoring/log_event.py

  ref:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Load country catalog (ref_paises)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          REF_CSV: data/ref/paises.csv
          TARGET_TABLE: gameday.ref_paises
        run: |
          python framework/ingestion/load_ref.py

      - name: Log event
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          STAGE: ref
          STATUS: ${{ job.status }}
          DETAILS: sha=${{ inputs.ref || github.sha }}
        run: |
          python framework/monitoring/log_event.py

  silver:
    runs-on: ubuntu-latest
    needs: [bronze, ref]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Load Silver (MERGE, solo clientes nuevos)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SQL_FILE: framework/processing/load_silver.sql
          SILVER_TABLE: gameday.silver_customers_v2
        run: |
          python framework/processing/run_sql.py

      - name: Log event
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          STAGE: silver
          STATUS: ${{ job.status }}
          DETAILS: sha=${{ inputs.ref || github.sha }}
        run: |
          python framework/monitoring/log_event.py

  validation:
    runs-on: ubuntu-latest
    needs: silver
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Validate Silver v2 + write ops_dq_results
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SILVER_TABLE: gameday.silver_customers_v2
        run: |
          python framework/validation/validate_silver.py

      - name: Log event
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          STAGE: validation
          STATUS: ${{ job.status }}
          DETAILS: sha=${{ inputs.ref || github.sha }}
        run: |
          python framework/monitoring/log_event.py

  gold:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Load Gold (contactables por país)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SQL_FILE: framework/processing/load_gold.sql
          SILVER_TABLE: gameday.silver_customers_v2
        run: |
          python framework/processing/run_sql.py

      - name: Log event
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          STAGE: gold
          STATUS: ${{ job.status }}
          DETAILS: sha=${{ inputs.ref || github.sha }}
        run: |
          python framework/monitoring/log_event.py

  tests:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run basic dataset tests
        run: |
          python framework/tests/test_dataset.py
