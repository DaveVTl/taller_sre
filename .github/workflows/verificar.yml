name: Game day – Verificar

# Compara producción contra lo esperado y da el puntaje técnico.
# Córranlo cuantas veces quieran: el MTTR se cuenta hasta el primer verde.

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (con historial)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Verificar producción
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python gameday/verificar.py
