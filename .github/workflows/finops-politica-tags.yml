name: FinOps – Política de tags

# Sin dueño no se publica: falla si una tabla Gold no tiene tag 'owner'
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["DataOps Pipeline – Bronze to Gold (SQL-only)"]
    types: [completed]

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sql-connector

      - name: Check owner tags on Gold
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          REQUIRED_TAGS: owner
        run: |
          python framework/tests/test_owner_tags.py
